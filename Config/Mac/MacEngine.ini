; ===== macOS (Apple Silicon, Metal) =====
[/Script/MacTargetPlatform.MacTargetSettings]
; SM6 es obligatorio para Nanite y Virtual Shadow Maps en Metal (requiere macOS 15+ y chip M2 o posterior).
-TargetedRHIs=SF_METAL_SM5
+TargetedRHIs=SF_METAL_SM6
-CachedShaderFormats=SF_METAL_SM5
+CachedShaderFormats=SF_METAL_SM6
MetalLanguageVersion=0
UseFastIntrinsics=True
EnableMathOptimisations=True
bBuildAllSupportedOnBundle=False

[/Script/Engine.RendererSettings]
; Lumen por software: el trazado por hardware y MegaLights siguen siendo experimentales en Apple Silicon.
r.Lumen.HardwareRayTracing=False
r.RayTracing=False

[SystemSettings]
; TSR es mas costoso en Apple Silicon: se renderiza al 67 % y se reconstruye.
r.ScreenPercentage=67
r.TSR.History.ScreenPercentage=100
; Niebla volumetrica a media resolucion: casi igual de bonita y la mitad de coste en la GPU del M4.
r.VolumetricFog.GridPixelSize=16
; La memoria es unificada: no reservar todo para texturas.
r.Streaming.PoolSize=2500
; Si Nanite/VSM dieran problemas (soporte Beta), basta con poner estos dos valores a 0:
;   r.Nanite=0  -> se usan las mallas de fallback
;   r.Shadow.Virtual.Enable=0 -> shadow maps clasicos

[ConsoleVariables]
; Ajustes medidos con stat gpu en un MacBook Pro M4 (GPU de 10 nucleos), editor en escalabilidad Epica:
;   Lumen (DeferredLighting + ScreenProbeGather) ~30 ms, Translucent Lighting ~6 ms, Postprocessing ~8 ms.
; Iluminacion global y reflejos en "Alta": Lumen pensado para 60 fps en vez de 30; en un interior pequeno
; apenas cambia la imagen.
sg.GlobalIlluminationQuality=2
sg.ReflectionQuality=2
; El volumen de luz para translucidos (cristales) no necesita Lumen ni tanta resolucion.
r.Lumen.TranslucencyVolume.Enable=0
r.TranslucencyLightingVolume.Dim=32
